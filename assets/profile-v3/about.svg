<text x="44" y="46" font-size="14" fill="#b8a0eb" font-weight="600" letter-spacing="2.5">01 / A LITTLE ABOUT ME</text>
<text x="44" y="98" font-size="32" fill="#eee8f5" font-weight="600">Curious about the interface.</text>
<text x="44" y="141" font-size="32" fill="#c4a7ec" font-weight="600">Even more curious about what powers it.</text>
<text x="44" y="188" font-size="21" fill="#b6afc5" >I'm Bruno, a software development student at ATEC in Portugal.</text>
<text x="44" y="221" font-size="21" fill="#b6afc5" >I build web and desktop projects, explore Linux and learn how the pieces fit together.</text>
</g></g><rect x="1" y="1" width="1198" height="258" rx="22" fill="none" stroke="#342a40"/></svg>
