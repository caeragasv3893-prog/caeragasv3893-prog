<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Bruno — Software Development</title>
  <desc id="desc">A dark, minimal banner with burgundy and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="62%" stop-color="#0d0c13"/>
      <stop offset="100%" stop-color="#170d1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f263f"/>
      <stop offset="100%" stop-color="#8964e8"/>
