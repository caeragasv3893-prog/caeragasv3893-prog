  <text x="98" y="194" fill="#a7a3b1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing=".25">Student at ATEC  /  Portugal</text>
  <path d="M98 222 H320" stroke="url(#accent)" stroke-width="2"/>
  <text x="98" y="246" fill="#777381" font-family="Consolas, monospace" font-size="12" letter-spacing=".8">BUILD  ·  LEARN  ·  IMPROVE</text>
